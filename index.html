<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looping Video Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Video Container -->
  <div class="video-container">
    <video 
      class="bg-video" 
      autoplay 
      muted 
      loop 
      playsinline 
      poster="assets/fallback.jpg">
      <!-- Replace with your local path or GitHub Release direct URL -->
      <source src="assets/bg-loop.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Page Content -->
  <main class="content">
    <h1>Heading Over Video</h1>
    <p>This text stays crisp and readable regardless of video brightness.</p>
    <a href="#learn-more" class="btn">Explore More</a>
  </main>

</body>
</html>
